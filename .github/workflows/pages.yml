name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run seed
      - run: npm run test:sql
      - run: npm run build
      - name: Release QA in a real browser (served under /Gabriel-portfolio/)
        run: |
          npx playwright install --with-deps chromium
          node scripts/serve-pages.mjs &
          sleep 2
          npm run test:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-qa
          path: test-results/release-qa.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
